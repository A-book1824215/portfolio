<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <!-- 方眼の細線（元帳・グラフ用紙のイメージ） -->
  <g stroke="#1E261F" stroke-width="1" opacity="0.06">
    <path d="M0,80 H640 M0,160 H640 M0,240 H640 M0,320 H640 M0,400 H640 M0,480 H640 M0,560 H640"/>
    <path d="M80,0 V640 M160,0 V640 M240,0 V640 M320,0 V640 M400,0 V640 M480,0 V640 M560,0 V640"/>
  </g>
  <!-- グリーンバー元帳の帯 -->
  <g fill="#BFD8B8" opacity="0.16">
    <rect x="0" y="80" width="640" height="80"/>
    <rect x="0" y="240" width="640" height="80"/>
    <rect x="0" y="400" width="640" height="80"/>
    <rect x="0" y="560" width="640" height="80"/>
  </g>
  <!-- セル参照のゴースト文字 -->
  <g fill="#1E261F" opacity="0.05" font-family="monospace" font-size="13" font-weight="700">
    <text x="90" y="35">A</text>
    <text x="170" y="35">B</text>
    <text x="250" y="35">C</text>
    <text x="330" y="35">D</text>
    <text x="410" y="35">E</text>
    <text x="490" y="35">F</text>
    <text x="570" y="35">G</text>
    <text x="20" y="70">1</text>
    <text x="20" y="150">2</text>
    <text x="20" y="230">3</text>
    <text x="20" y="310">4</text>
    <text x="20" y="390">5</text>
    <text x="20" y="470">6</text>
    <text x="20" y="550">7</text>
    <text x="20" y="630">8</text>
  </g>
</svg>
